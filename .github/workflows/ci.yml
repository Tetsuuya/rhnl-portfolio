name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Type-check, client build, SSR build and prerender (same as a real deploy)
      - name: Build
        run: npm run build

      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      # Older files still have lint errors; this reports them without failing the build.
      # Remove continue-on-error once `npm run lint` is clean.
      - name: Lint
        run: npm run lint
        continue-on-error: true
